name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 0 */3 * *" # 每 3 天執行一次 (UTC 時間，換算台灣時間為早上 8 點)
  workflow_dispatch: # 允許在 GitHub 頁面手動點擊執行測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat write to Supabase (Project 1)
        run: |
          curl -s -w "Project 1 Status: %{http_code}\n" -X POST \
            "${{ secrets.SUPABASE_URL_1 }}/rest/v1/heartbeat" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY_1 }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY_1 }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: resolution=merge-duplicates" \
          -d "{\"id\":1,\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
